[package]
name = "r2l"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
r2l-gym = { workspace = true, optional = true }
r2l-core = { workspace = true }
r2l-agents = { workspace = true }
r2l-sampler = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
burn = { workspace = true }
r2l-candle = { workspace = true }
r2l-burn = { workspace = true }
rand = "0.10.0"
derive_more = "2.0.1"
bimodal-array = { workspace = true }
serde = { workspace = true }
yaml_serde = { workspace = true } 

[features]
default = []
gym = ["dep:r2l-gym"]
test-utils = []
simd = ["r2l-burn/simd"]
cuda = [
  "r2l-core/cuda",
  "r2l-candle/cuda",
  "candle-core/cuda",
  "candle-nn/cuda",
]

[package.metadata.docs.rs]
features = ["gym"]

[dev-dependencies]
r2l = { path = ".", features = ["test-utils"] }
safetensors = { workspace = true }
tempfile = "3.27.0"

[lints]
workspace = true
