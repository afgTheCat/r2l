[package]
name = "r2l"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
r2l-gym = { workspace = true, optional = true }
r2l-core = { workspace = true }
r2l-agents = { workspace = true }
r2l-sampler = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
burn = { workspace = true }
r2l-distributions = { workspace = true }
rand = "0.10.3"
derive_more = "2.1.1"
bimodal-array = { workspace = true }
serde = { workspace = true }
yaml_serde = { workspace = true } 
itertools = { workspace = true }
csv = "1.4.0"

[features]
default = []
gym = ["dep:r2l-gym"]
python = ["r2l-core/python"]
cuda = [
  "r2l-core/cuda",
  "r2l-distributions/cuda",
  "candle-core/cuda",
  "candle-nn/cuda",
]

[package.metadata.docs.rs]
features = ["gym"]

[lints]
workspace = true
