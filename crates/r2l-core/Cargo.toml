[package]
name = "r2l-core"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
rand = { workspace = true }
rayon = "1.10.0"
derive_more = { version = "2.0.1", features = ["full"] }
either = {workspace = true}
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
burn = { workspace = true, optional = true }
# Enable Flex here while burn/flex requires unavailable burn-vision 0.22 metadata.
burn-core = { version = "0.22.0", default-features = false, features = ["flex"], optional = true }
itertools = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[features]
candle = ["dep:candle-core", "dep:candle-nn"]
burn = ["dep:burn", "dep:burn-core"]
cuda = ["candle", "candle-core/cuda"]
default = ["candle", "burn"]

[lints]
workspace = true
