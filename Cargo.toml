[workspace]
members = [
  "crates/r2l",
  "crates/r2l-core",
  "crates/r2l-gym",
  # "crates/r2l-macros",
  "crates/r2l-examples",
  "crates/r2l-agents",
  "crates/r2l-candle",
  "crates/r2l-burn",
  "crates/r2l-sampler",
  "crates/r2l-zoo-evaluator",
]
resolver = "3"

[workspace.dependencies]
# r2l-macros = { path = "crates/r2l-macros", version = "0.0.2" }
r2l-core = { path = "crates/r2l-core", version = "0.0.2" }
r2l-gym = { path = "crates/r2l-gym", version = "0.0.2" }
r2l-agents = { path = "crates/r2l-agents", version = "0.0.2" }
r2l = { path = "crates/r2l", version = "0.0.2" }
r2l-candle = { path = "crates/r2l-candle", version = "0.0.2" }
r2l-burn = { path = "crates/r2l-burn", version = "0.0.2" }
r2l-sampler = { path = "crates/r2l-sampler", version = "0.0.2" }
burn = { version = "0.21.0", features = ["ndarray", "autodiff"] }
burn-store = { version = "0.21.0" }
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
either = "1.15.0"
crossbeam = "0.8.4"
rand = "0.10.0"
rand_distr = "0.6.0"
anyhow = { version = "1.0.102" }
bimodal-array = { version = "0.1.4" }
safetensors = { version = "0.8.0" }
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.4"
itertools = "0.15.0"

[workspace.package]
version = "0.0.2"
edition = "2024"
description = "A rust reinforcement learning library"
repository = "https://github.com/afgTheCat/r2l"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
